<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <!-- 烽燧阵线地形（边塞夯土、石铺与久战痕迹）：只画夯土与石铺地面材质，长城、关楼与烽燧由 2.5D 道具表现。 -->
  <defs>
    <linearGradient id="earth" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#8f7551"/>
      <stop offset=".45" stop-color="#7a6041"/>
      <stop offset=".78" stop-color="#634c33"/>
      <stop offset="1" stop-color="#4e3a27"/>
    </linearGradient>
    <linearGradient id="sun" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d8b982" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#b08c5c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#5a3f27" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="wear" cx=".5" cy=".44" r=".72">
      <stop offset="0" stop-color="#e2c99a" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#b89a6e" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3a2a19" stop-opacity=".34"/>
    </radialGradient>
    <pattern id="rammed" width="220" height="46" patternUnits="userSpaceOnUse">
      <path d="M0 45.2H220" stroke="#3c2c1c" stroke-width="2" opacity=".22"/>
      <path d="M32 0V46M104 0V46M178 0V46" stroke="#4b3824" stroke-width="1.4" opacity=".12"/>
      <path d="M12 10H84M128 32H204M54 26H96" stroke="#d3b98c" stroke-width="1.1" opacity=".13"/>
      <ellipse cx="160" cy="14" rx="12" ry="3" fill="#57412b" opacity=".14"/>
      <ellipse cx="70" cy="36" rx="15" ry="4" fill="#3f2e1e" opacity=".10"/>
    </pattern>
    <pattern id="paving" width="150" height="76" patternUnits="userSpaceOnUse">
      <rect width="150" height="76" fill="#8a704c" opacity=".20"/>
      <path d="M0 1.5H150M0 74.5H150M1.5 0V38M75 38V76M148.5 0V76" stroke="#3a2b1b" stroke-width="1.8" opacity=".22"/>
      <path d="M0 38H75M75 0V38" stroke="#a98d61" stroke-width="1" opacity=".14"/>
      <ellipse cx="46" cy="20" rx="14" ry="4" fill="#5b462f" opacity=".12"/>
      <ellipse cx="112" cy="56" rx="18" ry="5" fill="#4a3825" opacity=".10"/>
    </pattern>
    <pattern id="ash" width="260" height="260" patternUnits="userSpaceOnUse">
      <circle cx="34" cy="52" r="2" fill="#d9c6a1" opacity=".22"/>
      <circle cx="128" cy="26" r="1.4" fill="#e6d5b2" opacity=".18"/>
      <circle cx="210" cy="96" r="2.2" fill="#b39a74" opacity=".20"/>
      <circle cx="82" cy="152" r="1.6" fill="#d9c6a1" opacity=".16"/>
      <circle cx="186" cy="206" r="2" fill="#e6d5b2" opacity=".15"/>
      <circle cx="244" cy="168" r="1.2" fill="#b39a74" opacity=".18"/>
      <circle cx="24" cy="222" r="1.8" fill="#d9c6a1" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#earth)"/>
  <rect width="1200" height="600" fill="url(#paving)"/>
  <rect width="1200" height="600" fill="url(#rammed)"/>
  <rect width="1200" height="600" fill="url(#sun)"/>
  <rect width="1200" height="600" fill="url(#ash)"/>
  <rect width="1200" height="600" fill="url(#wear)"/>

  <!-- 干裂与车辙 -->
  <g fill="none" stroke="#3b2b1b" stroke-linecap="round">
    <path d="M88 0l24 74 44 58-10 84 34 96 8 74 46 92 6 122" stroke-width="3" opacity=".20"/>
    <path d="M112 74l38-14M156 132l44 8M122 216l-36 22M188 370l50-16M226 466l42 12M246 536l-38 26" stroke-width="2" opacity=".16"/>
    <path d="M1024 600l-18-62-46-52 12-78-30-88 22-96-16-86 32-84 14-54" stroke-width="3" opacity=".18"/>
    <path d="M1006 538l-44 10M948 486l-38-18M972 408l40-22M942 320l-44 6M964 224l42-14M950 140l-40-20" stroke-width="2" opacity=".15"/>
    <path d="M416 20l16 52-22 58 30 66-16 72 26 84-8 78 24 90-14 80" stroke-width="2.4" opacity=".12"/>
    <path d="M742 0l-14 68 22 66-28 74 18 82-26 88 20 86-12 76 18 60" stroke-width="2.4" opacity=".12"/>
  </g>

  <!-- 散落的碎石与旧砖 -->
  <g opacity=".30">
    <rect x="286" y="102" width="34" height="18" rx="3" fill="#9c8158" transform="rotate(-12 303 111)"/>
    <rect x="872" y="138" width="42" height="20" rx="3" fill="#8a704a" transform="rotate(8 893 148)"/>
    <rect x="516" y="474" width="38" height="18" rx="3" fill="#9c8158" transform="rotate(14 535 483)"/>
    <rect x="1042" y="352" width="30" height="16" rx="3" fill="#7d6543" transform="rotate(-18 1057 360)"/>
    <rect x="168" y="330" width="26" height="14" rx="3" fill="#8a704a" transform="rotate(20 181 337)"/>
    <path d="M330 244l12-7 9 10-8 12-13-4z" fill="#6e573a"/>
    <path d="M806 252l14-5 7 12-10 10-13-5z" fill="#6e573a"/>
    <path d="M614 82l10-6 8 9-7 11-12-3z" fill="#6e573a"/>
    <path d="M402 556l13-6 8 11-9 11-13-4z" fill="#6e573a"/>
  </g>

  <!-- 零星苔痕，暗示边塞久战 -->
  <g fill="#5f6a3d" opacity=".16">
    <ellipse cx="214" cy="468" rx="46" ry="13"/>
    <ellipse cx="966" cy="86" rx="54" ry="15"/>
    <ellipse cx="644" cy="322" rx="38" ry="11"/>
    <ellipse cx="106" cy="64" rx="34" ry="10"/>
    <ellipse cx="1122" cy="502" rx="40" ry="12"/>
  </g>

  <!-- 长城投下的阴影：让中央墙体不只是贴图 -->
  <defs>
    <linearGradient id="wallshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1109" stop-opacity="0"/>
      <stop offset=".32" stop-color="#1a1109" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#120b05" stop-opacity=".46"/>
      <stop offset=".68" stop-color="#1a1109" stop-opacity=".30"/>
      <stop offset="1" stop-color="#1a1109" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="500" y="0" width="200" height="600" fill="url(#wallshade)" opacity=".85"/>

  <!-- 关门内外被踩实的土路与焦痕 -->
  <g opacity=".30">
    <ellipse cx="600" cy="182" rx="76" ry="26" fill="#2a1a0e"/>
    <ellipse cx="600" cy="422" rx="76" ry="26" fill="#2a1a0e"/>
    <ellipse cx="600" cy="62" rx="46" ry="18" fill="#241609" opacity=".7"/>
    <ellipse cx="600" cy="302" rx="46" ry="18" fill="#241609" opacity=".7"/>
    <ellipse cx="600" cy="542" rx="46" ry="18" fill="#241609" opacity=".7"/>
  </g>
  <g fill="#d6bd8c" opacity=".10">
    <ellipse cx="600" cy="180" rx="58" ry="16"/>
    <ellipse cx="600" cy="420" rx="58" ry="16"/>
  </g>

  <!-- 通往关门的两条踩踏足迹 -->
  <g fill="#332416" opacity=".20">
    <ellipse cx="502" cy="198" rx="6" ry="3.4" transform="rotate(-14 502 198)"/>
    <ellipse cx="486" cy="206" rx="6" ry="3.4" transform="rotate(-14 486 206)"/>
    <ellipse cx="466" cy="214" rx="6" ry="3.4" transform="rotate(-12 466 214)"/>
    <ellipse cx="446" cy="220" rx="6" ry="3.4" transform="rotate(-10 446 220)"/>
    <ellipse cx="698" cy="398" rx="6" ry="3.4" transform="rotate(12 698 398)"/>
    <ellipse cx="714" cy="390" rx="6" ry="3.4" transform="rotate(12 714 390)"/>
    <ellipse cx="734" cy="382" rx="6" ry="3.4" transform="rotate(10 734 382)"/>
    <ellipse cx="754" cy="376" rx="6" ry="3.4" transform="rotate(8 754 376)"/>
  </g>

  <!-- 散落的箭矢与断矛 -->
  <g stroke="#4a3825" stroke-width="1.5" stroke-linecap="round" opacity=".42">
    <path d="M690 286l30-9"/><path d="M720 277l-6-3M720 277l-1 6"/>
    <path d="M508 330l-26 12"/><path d="M482 342l6 2M482 342l1-6"/>
    <path d="M662 470l22-16"/><path d="M684 454l-7-1M684 454l2 6"/>
    <path d="M540 120l-20-12"/><path d="M520 108l6-1M520 108l-1 7"/>
  </g>
  <g fill="#8a704a" opacity=".30">
    <path d="M672 300l14-4 5 5-11 6z"/>
    <path d="M520 480l12-5 4 6-10 5z"/>
  </g>

  <!-- 干枯草丛与营火遗迹 -->
  <g stroke="#5f6a3d" stroke-width="1.5" stroke-linecap="round" opacity=".26" fill="none">
    <path d="M302 468q-5-13 0-21M309 468q4-11 10-17M316 468q-2-9 3-15"/>
    <path d="M988 214q-5-13 0-21M995 214q4-11 10-17M1002 214q-2-9 3-15"/>
    <path d="M176 388q-5-12 0-19M183 388q4-10 9-16M190 388q-2-8 3-14"/>
    <path d="M846 512q-4-11 0-18M852 512q3-9 8-14M858 512q-2-7 2-12"/>
    <path d="M430 96q-4-11 0-18M436 96q3-9 8-14"/>
    <path d="M1044 430q-4-11 0-18M1050 430q3-9 8-14"/>
  </g>
  <g fill="none" stroke="#3a2a19" stroke-width="3" opacity=".22">
    <circle cx="196" cy="252" r="13"/>
    <circle cx="196" cy="252" r="6"/>
    <circle cx="958" cy="446" r="11"/>
  </g>
  <g fill="#2a1c10" opacity=".36">
    <circle cx="192" cy="248" r="2"/><circle cx="201" cy="256" r="1.6"/>
    <circle cx="954" cy="443" r="1.8"/><circle cx="962" cy="449" r="1.4"/>
  </g>

  <!-- 旧营帐地钉与折断的旗杆 -->
  <g stroke="#3b2a18" stroke-width="2.4" stroke-linecap="round" opacity=".34">
    <path d="M282 150l-4 16M322 164l-3 14M366 148l-3 15"/>
    <path d="M900 520l5-34"/>
  </g>
  <path d="M905 486l14 4-10 9-6-5z" fill="#6b4a33" opacity=".45"/>

  <!-- 车辙旁洒落的草料 -->
  <g stroke="#7d6a42" stroke-width="1.2" stroke-linecap="round" opacity=".30">
    <path d="M336 300l8 3M344 303l7-2M352 301l6 3"/>
    <path d="M782 96l8 2M790 98l7-3M798 96l6 2"/>
    <path d="M112 548l7 2M119 550l6-2"/>
  </g>
</svg>
