<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2630"/>
      <stop offset=".5" stop-color="#0f3a42"/>
      <stop offset="1" stop-color="#071b23"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8ffce9" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#2fd3c2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1a8f90" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6464"/>
      <stop offset=".55" stop-color="#12494f"/>
      <stop offset="1" stop-color="#0a323b"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d7a"/>
      <stop offset="1" stop-color="#314a4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#night)"/>
  <!-- distant sea fog -->
  <path d="M0 210 Q160 186 320 208 T640 204 T960 212 T1200 200 L1200 260 L0 260 Z" fill="#164a52" opacity=".55"/>
  <path d="M0 246 Q200 226 400 244 T800 240 T1200 246 L1200 300 L0 300 Z" fill="#1b5a5e" opacity=".35"/>
  <!-- horizon glow -->
  <ellipse cx="600" cy="300" rx="430" ry="150" fill="url(#glow)" opacity=".5"/>
  <!-- tidal flats -->
  <path d="M0 300 Q180 280 360 300 T720 296 T1080 304 L1200 292 L1200 600 L0 600 Z" fill="url(#wet)"/>
  <!-- shallow water bands -->
  <g stroke="#5fe0cf" stroke-width="2" opacity=".28" fill="none">
    <path d="M80 352 q30 -8 60 0 t60 0"/>
    <path d="M310 386 q30 -8 60 0 t60 0"/>
    <path d="M560 340 q30 -8 60 0 t60 0"/>
    <path d="M820 392 q30 -8 60 0 t60 0"/>
    <path d="M1030 356 q30 -8 60 0 t60 0"/>
    <path d="M180 470 q40 -10 80 0 t80 0"/>
    <path d="M700 486 q40 -10 80 0 t80 0"/>
  </g>
  <!-- sunken ruins left -->
  <g opacity=".85">
    <rect x="90" y="286" width="200" height="16" rx="3" fill="url(#stone)"/>
    <g fill="url(#stone)">
      <rect x="104" y="240" width="18" height="52" rx="2" transform="rotate(-4 113 266)"/>
      <rect x="146" y="228" width="18" height="64" rx="2"/>
      <rect x="188" y="246" width="18" height="46" rx="2" transform="rotate(6 197 269)"/>
    </g>
    <path d="M146 228 l16 -18 h6 l14 18 z" fill="#4d6c69"/>
    <ellipse cx="190" cy="304" rx="120" ry="14" fill="#0c3238" opacity=".8"/>
  </g>
  <!-- broken arch right -->
  <g transform="translate(930 300)" opacity=".9">
    <path d="M0 96 q0 -64 54 -64 q54 0 54 64 l-16 0 q0 -48 -38 -48 q-38 0 -38 48 z" fill="url(#stone)"/>
    <rect x="0" y="92" width="108" height="12" fill="#3b5654"/>
    <rect x="20" y="104" width="14" height="34" fill="#314a4a" transform="rotate(3 27 121)"/>
  </g>
  <!-- tide pools -->
  <g fill="#0a2730" opacity=".75">
    <ellipse cx="420" cy="520" rx="150" ry="34"/>
    <ellipse cx="840" cy="556" rx="190" ry="40"/>
  </g>
  <g fill="none" stroke="#6ff0dc" stroke-width="2" opacity=".35">
    <ellipse cx="420" cy="520" rx="150" ry="34"/>
    <ellipse cx="840" cy="556" rx="190" ry="40"/>
  </g>
  <!-- central eye motif -->
  <g transform="translate(600 330)" opacity=".55">
    <ellipse cx="0" cy="0" rx="150" ry="60" fill="none" stroke="#7ffced" stroke-width="3"/>
    <path d="M-140 0 Q0 -80 140 0 Q0 80 -140 0 Z" fill="none" stroke="#7ffced" stroke-width="4"/>
    <circle r="30" fill="#0a2a30" stroke="#8ffce9" stroke-width="4"/>
    <circle r="12" fill="#9dfff0"/>
  </g>
  <!-- floating motes -->
  <g fill="#9dfff0">
    <circle cx="240" cy="220" r="2" opacity=".8"/>
    <circle cx="340" cy="180" r="1.5" opacity=".55"/>
    <circle cx="760" cy="196" r="2" opacity=".7"/>
    <circle cx="980" cy="242" r="1.5" opacity=".5"/>
    <circle cx="1100" cy="190" r="2" opacity=".65"/>
  </g>
  <path d="M0 0 h1200 v600 H0 Z" fill="none" stroke="rgba(4,18,24,.5)" stroke-width="44"/>
</svg>
