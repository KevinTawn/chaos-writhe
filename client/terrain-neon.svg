<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <!-- 霓虹纪元地形：轨道数据城的合金平台，只铺地面材质，核心与上传环由界面图层表现。 -->
  <defs>
    <linearGradient id="alloy" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#192338"/>
      <stop offset=".45" stop-color="#111a2a"/>
      <stop offset=".8" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#070d17"/>
    </linearGradient>
    <linearGradient id="sheen" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#45d6c8" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#2b7fa8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#0a1220" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".46" r=".78">
      <stop offset="0" stop-color="#2b4e66" stop-opacity=".10"/>
      <stop offset=".62" stop-color="#0a1320" stop-opacity=".05"/>
      <stop offset="1" stop-color="#03070c" stop-opacity=".55"/>
    </radialGradient>
    <pattern id="plates" width="240" height="120" patternUnits="userSpaceOnUse">
      <rect width="240" height="120" fill="none"/>
      <path d="M0 119.5H240M0 .5H240M.5 0V120M239.5 0V120" stroke="#3d5c74" stroke-width="1.4" opacity=".20"/>
      <path d="M120 0V120M0 60H240" stroke="#2a4056" stroke-width="1" opacity=".16"/>
      <path d="M8 8H44M8 13v4M52 8H104" stroke="#63b9c4" stroke-width="1" opacity=".10"/>
      <circle cx="12" cy="12" r="1.6" fill="#7fe6df" opacity=".18"/>
      <circle cx="228" cy="108" r="1.6" fill="#7fe6df" opacity=".14"/>
      <path d="M168 84h34M202 84v14" stroke="#45d6c8" stroke-width="1.2" opacity=".10"/>
      <path d="M0 0l24 24M240 0l-24 24M0 120l24-24M240 120l-24-24" stroke="#4b7c96" stroke-width="1" opacity=".07"/>
    </pattern>
    <pattern id="microgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#45d6c8" stroke-width=".6" opacity=".055"/>
    </pattern>
    <pattern id="dataflow" width="300" height="300" patternUnits="userSpaceOnUse">
      <path d="M26 300V176l52-52h70l40-40h88" fill="none" stroke="#45d6c8" stroke-width="1.2" opacity=".10"/>
      <path d="M300 206H236l-34 34v60" fill="none" stroke="#d46ad8" stroke-width="1" opacity=".07"/>
      <circle cx="146" cy="124" r="2" fill="#79efe4" opacity=".20"/>
      <circle cx="236" cy="206" r="1.4" fill="#e28be6" opacity=".16"/>
      <circle cx="52" cy="176" r="1.4" fill="#79efe4" opacity=".13"/>
      <rect x="186" y="62" width="8" height="2" fill="#9af3ec" opacity=".10"/>
    </pattern>
    <pattern id="scuff" width="260" height="260" patternUnits="userSpaceOnUse">
      <path d="M18 34l52 18M96 88l44-8M28 150l36 10M170 40l38 22M210 146l30 12M60 224l46-6" stroke="#5b7f95" stroke-width=".8" opacity=".07"/>
      <ellipse cx="132" cy="196" rx="16" ry="4" fill="#02060b" opacity=".18"/>
      <ellipse cx="224" cy="104" rx="11" ry="3" fill="#02060b" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#alloy)"/>
  <rect width="1200" height="600" fill="url(#microgrid)"/>
  <rect width="1200" height="600" fill="url(#plates)"/>
  <rect width="1200" height="600" fill="url(#dataflow)"/>
  <rect width="1200" height="600" fill="url(#sheen)"/>
  <rect width="1200" height="600" fill="url(#scuff)"/>
  <rect width="1200" height="600" fill="url(#vignette)"/>

  <!-- 中央数据干道：与数据核心（第 5 列中部）对齐的冷光带。 -->
  <g opacity=".30">
    <rect x="588" y="0" width="24" height="600" fill="#0a2c36"/>
    <path d="M593 0v600M607 0v600" stroke="#45d6c8" stroke-width="1.6" opacity=".45"/>
    <path d="M600 40v50M600 180v40M600 304v34M600 430v48" stroke="#9ffff4" stroke-width="1.2" opacity=".22"/>
  </g>
  <g opacity=".18">
    <path d="M0 300h1200" stroke="#3f7c8c" stroke-width="1.2"/>
    <path d="M240 292v16M410 292v16M790 292v16M960 292v16" stroke="#6fe0d6" stroke-width="1.2"/>
  </g>

  <!-- 阵营地面的暗色标识：左红右蓝，只在边缘轻描。 -->
  <g opacity=".10">
    <path d="M0 0h360L300 600H0z" fill="#d94b5c"/>
    <path d="M1200 0H840l60 600h300z" fill="#4b7fd9"/>
  </g>
</svg>
